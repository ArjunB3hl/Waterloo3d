<body data-portfolio>
  <div id="app" class="portfolio-mode title-open" aria-label="Arjun Behl's interactive portfolio: a campus map you explore as a goose">
    <div id="stage" role="application" aria-label="Isometric map of the University of Waterloo campus. Start flying to steer a goose between the portfolio stops." tabindex="0">
      <canvas id="map-base"></canvas>
      <div id="labels" aria-hidden="false"></div>
    </div>
    <div id="ui">
      <!-- Painted with the page, before the map loads; portfolio/game.ts replaces it with the working title screen. -->
      <div class="title-screen" id="title-boot">
        <div class="title-box">
          <p class="title-kicker">An interactive portfolio</p>
          <h1>Arjun Behl</h1>
          <p class="title-tag">I build software and AI-powered tools.</p>
          <p class="title-sub">Fly a goose over the University of Waterloo campus and find the stops: my projects, experience, education, skills and how to reach me.</p>
          <button type="button" class="btn primary title-start" disabled aria-busy="true">Loading the map…</button>
        </div>
      </div>
    </div>
    <footer id="attribution" aria-label="Map data attribution"></footer>
  </div>
  <noscript>
    <div style="max-width:42rem;margin:2rem auto;padding:0 1.25rem;font:1rem/1.6 system-ui,sans-serif;color:#eee;background:#1d2024">
      <h1>Arjun Behl</h1>
      <p>I build software and AI-powered tools. Engineering master’s student at the University of Waterloo, with interests in mobile applications, embedded systems, and the hardware behind AI.</p>
      <p>This portfolio is an interactive map that needs JavaScript. The projects: CrisisRoom (1st Place and MLH Best Use of Vultr, CommuniHacks 2026) at <a href="https://github.com/jeefwashere/CrisisRoom">github.com/jeefwashere/CrisisRoom</a>; Rhythm (Top 10 Finalist, Build North 2026) at <a href="https://github.com/ArjunB3hl/BuildNorth">github.com/ArjunB3hl/BuildNorth</a>; Dune Rush (Devin Game Jam – Kick005, built with Ali) at <a href="https://github.com/AliasgarTawa/dev-game">github.com/AliasgarTawa/dev-game</a>.</p>
      <p>Contact: <a href="mailto:arjun.behl.2003@gmail.com">arjun.behl.2003@gmail.com</a> · <a href="https://www.linkedin.com/in/arjunbehl8/">LinkedIn</a> · <a href="https://github.com/ArjunB3hl">GitHub</a></p>
    </div>
  </noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
